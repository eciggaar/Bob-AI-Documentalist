# Aangifte en fiscale documentklassen - Stage 4
# Maakt 30 documentsubklassen aan voor het Nederlandse belasting- en douanedomein.
# Deze klassen vertegenwoordigen een realistische repository-toestand voor
# laboefeningen: vijf klassen zijn bewust aangemaakt als duplicaat of
# consolidatiekandiaat, zodat de AI Documentalist ze kan identificeren.
#
# Uitvoeringsvolgorde: uitvoeren NA voltooiing van 01, 02 en 03.
# Kan ook zelfstandig worden uitgevoerd zonder afhankelijkheid van de
# keuzenlijsten of eigenschapstemplates uit bestanden 01 en 02.
# Runner: python graphql/run_graphql.py graphql/04-tax-class-definitions.graphql
#
# Consolidatiekandidaten (bewust opgenomen):
#   AangifteBTWKwartaal              → samenvoegen met AangifteBTW; Periode-eigenschap toevoegen
#   CorrectieAangifteLoonheffingen   → samenvoegen met AangifteLoonheffingen; IsCorrectie boolean toevoegen
#   VoortaxatieVennootschapsbelasting → samenvoegen met AangifteVennootschapsbelasting; AanslagType toevoegen
#   VereenvoudigdeDouaneaangifte     → samenvoegen met Douaneaangifte; AangifteType-eigenschap toevoegen
#   MotorrijtuigenbelastingAangifte  → mogelijk redundant of legacy; gebruiksanalyse vereist

# ---------------------------------------------------------------------------
