mutation CreateAangifteBTWClass {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "Document"
    classDefinitionProperties: {
      symbolicName: "AangifteBTW"
      displayNames: {
        replace: [
          {
            localeName: "en-us"
            localizedText: "BTW Aangifte"
          }
        ]
      }
      descriptiveTexts: {
        replace: [
          {
            localeName: "nl-nl"
            localizedText: "Periodieke BTW-aangifte ingediend bij de Belastingdienst. Bevat de opgave van verschuldigde omzetbelasting en aftrekbare voorbelasting over een belastingtijdvak (maand, kwartaal of jaar)."
