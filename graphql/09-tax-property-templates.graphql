# Tax domain property templates - Stage 9
# Maakt 30 Nederlandse eigenschapstemplates aan voor de belasting- en douanedocumentklassen.
# Elk template heeft een Nederlandse weergavenaam en een beschrijvende tekst (nl-nl).
# Deze templates worden in bestand 10 gebonden aan de 30 belastingklassen.
#
# Uitvoeringsvolgorde: uitvoeren VOOR bestand 10.
# De 30 belastingklassen zijn al aanwezig; bestanden 01-04 hoeven niet opnieuw te worden uitgevoerd.
#
# Runner: python graphql/run_graphql.py graphql/09-tax-property-templates.graphql

# ---------------------------------------------------------------------------
# ALGEMENE AANGIFTE-EIGENSCHAPPEN
# ---------------------------------------------------------------------------

mutation CreateBelastingjaarPropertyTemplate {
  admCreatePropertyTemplate(
    repositoryIdentifier: "OS1"
    dataType: LONG
    propertyTemplateProperties: {
      cardinality: SINGLE
      symbolicName: "Belastingjaar"
      displayNames: {
        replace: [{ localeName: "nl-nl", localizedText: "Belastingjaar" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "nl-nl", localizedText: "Het kalenderjaar waarop de aangifte of het document betrekking heeft." }]
      }
    }
  ) { id }
}

