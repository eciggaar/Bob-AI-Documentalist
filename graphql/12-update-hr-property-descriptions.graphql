# Update HRDocument property template descriptions - Stage 12
# Sets an en-us descriptiveText on each of the 36 custom HRDocument property
# templates created by file 02. Use this on a repository where file 02 has already
# been run (re-running file 02 would fail on duplicate symbolic names).
#
# Idempotent: descriptiveTexts uses "replace", so re-running is safe.
# Descriptions are identical to those in file 02.
#
# Runner: python graphql/run_graphql.py graphql/12-update-hr-property-descriptions.graphql

mutation UpdateFirstNamePropertyTemplateDescription {
  admUpdatePropertyTemplate(
    repositoryIdentifier: "OS1"
    identifier: "FirstName"
    propertyTemplateProperties: {
      descriptiveTexts: {
        replace: [{ localeName: "en-us", localizedText: "The employee's legal first name as recorded in the HR system." }]
      }
    }
  ) {
    id
    symbolicName
  }
}

