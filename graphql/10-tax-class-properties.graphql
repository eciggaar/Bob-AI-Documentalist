# Tax domain klasse-eigenschappen - Stage 10
# Bindt de eigenschapstemplates uit bestand 09 aan de 30 belastingklassen.
# Elke klasse krijgt maximaal 10 eigenschappen die aansluiten op het documenttype.
#
# Consolidatiekandidaten zijn gemarkeerd met ⚠️ CONSOLIDATIEKANDIDAAT.
# Deze klassen hebben bewust een kleinere eigenschappenset dan hun canonieke tegenhanger,
# zodat de overlap zichtbaar is bij schema-inspectie:
#   AangifteBTWKwartaal              ⚠️ → subset van AangifteBTW
#   CorrectieAangifteLoonheffingen   ⚠️ → subset van AangifteLoonheffingen
#   VoortaxatieVennootschapsbelasting ⚠️ → subset van AangifteVennootschapsbelasting
#   VereenvoudigdeDouaneaangifte     ⚠️ → subset van Douaneaangifte
#   MotorrijtuigenbelastingAangifte  ⚠️ → subset van AangifteBPM
#
# Uitvoeringsvolgorde: uitvoeren NA bestand 09.
# Runner: python graphql/run_graphql.py graphql/10-tax-class-properties.graphql

# ---------------------------------------------------------------------------
# BTW-AANGIFTEN (4 klassen)
# ---------------------------------------------------------------------------

# Canonieke klasse: 7 eigenschappen incl. Belastingtijdvak en IsCorrectie.
mutation UpdateAangifteBTWProperties {
  admUpdateClassDefinition(
    repositoryIdentifier: "OS1"
    identifier: "AangifteBTW"
    classDefinitionProperties: {
      propertyDefinitions: {
        modify: [
          { propertyTemplate: { identifier: "Belastingjaar" }    isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "Belastingtijdvak" } isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "AangifteDatum" }    isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "RSIN" }             isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "VerschuldigdBedrag" } isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "TeruggaafBedrag" }  isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "IsCorrectie" }      isValueRequired: false isHidden: false }
        ]
      }
    }
  ) { id symbolicName }
}

