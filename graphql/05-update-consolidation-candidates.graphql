# Update consolidation candidate descriptions - Stage 5
# Updates the descriptiveText of the 5 consolidation-candidate classes to remove
# hardcoded consolidation instructions. Descriptions are rewritten in plain Dutch
# so that overlap with the canonical class is semantically apparent without being
# stated explicitly. An AI reading both descriptions should infer the redundancy.
#
# Runner: python graphql/run_graphql.py graphql/05-update-consolidation-candidates.graphql

mutation UpdateAangifteBTWKwartaalDescription {
  admUpdateClassDefinition(
    repositoryIdentifier: "OS1"
    identifier: "AangifteBTWKwartaal"
    classDefinitionProperties: {
      descriptiveTexts: {
        replace: [
          {
            localeName: "nl-nl"
            localizedText: "Kwartaalversie van de periodieke BTW-aangifte ingediend bij de Belastingdienst. Bevat dezelfde opgave van verschuldigde omzetbelasting en aftrekbare voorbelasting als de maandelijkse BTW-aangifte, maar samengesteld over een kwartaaltijdvak."
          }
        ]
      }
    }
  ) {
    id
    symbolicName
  }
}

