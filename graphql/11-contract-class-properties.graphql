# ---------------------------------------------------------------------------
# STAP 3 — MAAK DE CONTRACT-KLASSE OPNIEUW AAN MET ALLEEN DE 8 CONTRACTEIGENSCHAPPEN
# ---------------------------------------------------------------------------

mutation CreateContractClass {
  admCreateClassDefinition(
    repositoryIdentifier: "OS1"
    superclassIdentifier: "Document"
    classDefinitionProperties: {
      symbolicName: "Contract"
      displayNames: {
        replace: [{ localeName: "nl-nl", localizedText: "Contract" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "nl-nl", localizedText: "Contractdocument vastgelegd in het contractbeheersysteem. Omvat overeenkomsten met leveranciers, klanten en partners, zoals leveringsovereenkomsten, dienstverleningscontracten, NDA's en raamcontracten." }]
      }
      propertyDefinitions: {
        modify: [
          { propertyTemplate: { identifier: "ContractNummer" }       isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractSoort" }        isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractPartij" }       isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractIngangsdatum" } isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractEinddatum" }    isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractWaarde" }       isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractStatus" }       isValueRequired: false isHidden: false }
          { propertyTemplate: { identifier: "ContractEigenaar" }     isValueRequired: false isHidden: false }
        ]
      }
    }
  ) { id symbolicName }
}
