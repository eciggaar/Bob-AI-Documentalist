# Contract klasse — verwijderen en opnieuw aanmaken - Stage 11
# Verwijdert de bestaande Contract-klasse (die de HR-templates EmployeeID, FirstName
# en LastName bevat) en maakt een nieuwe schone versie aan met uitsluitend 8
# Nederlandstalige contracteigenschappen.
#
# Lab 3 compatibiliteit:
#   De uploadscript (.bob/skills/hr-document-upload/scripts/execute_bulk_upload.py)
#   uploadt het arbeidscontract van emp[1] als klasse "Contract" met properties = [].
#   Er worden dus GEEN eigenschapswaarden gezet op het Contract-document.
#   De fout blijft detecteerbaar: geen EmployeeID, Department of DocType aanwezig.
#
# Uitvoeringsvolgorde:
#   1. DeleteContractClass         — verwijdert de bestaande klasse
#   2. Create*PropertyTemplate     — maakt 8 contracteigenschapstemplates aan
#   3. CreateContractClass         — maakt de klasse opnieuw aan met de 8 templates
#
# De runner voert mutaties sequentieel uit; de volgorde in dit bestand is dus bepalend.
# Runner: python graphql/run_graphql.py graphql/11-contract-class-properties.graphql

# ---------------------------------------------------------------------------
# STAP 1 — VERWIJDER DE BESTAANDE CONTRACT-KLASSE
# ---------------------------------------------------------------------------

mutation DeleteContractClass {
  admDeleteClassDefinition(
    repositoryIdentifier: "OS1"
    identifier: "Contract"
    updateSequenceNumber: 0
  ) { id }
}

# ---------------------------------------------------------------------------
# STAP 2 — MAAK 8 CONTRACTEIGENSCHAPSTEMPLATES AAN
# ---------------------------------------------------------------------------

mutation CreateContractNummerPropertyTemplate {
  admCreatePropertyTemplate(
    repositoryIdentifier: "OS1"
    dataType: STRING
    propertyTemplateProperties: {
      cardinality: SINGLE
      symbolicName: "ContractNummer"
      displayNames: {
        replace: [{ localeName: "nl-nl", localizedText: "Contractnummer" }]
      }
      descriptiveTexts: {
        replace: [{ localeName: "nl-nl", localizedText: "Het unieke interne referentienummer waarmee het contract in de administratie wordt geïdentificeerd." }]
      }
    }
  ) { id }
}

