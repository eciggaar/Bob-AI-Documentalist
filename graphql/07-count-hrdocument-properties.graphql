# HRDocument property count query
# Returns every property definition attached to the HRDocument class so the
# total count — and system/custom/hidden splits — can be verified.
# Replace OS1 with the target repository symbolic identifier or GUID.
#
# NOTE: isSearchable is not exposed by the admClassDefinition GraphQL surface
# in this tenant. Use the MCP get_class_property_descriptions tool for
# searchable vs non-searchable counts (baseline: 91 searchable / 17 not).
#
# Run via the helper script below (run_graphql.py handles mutations only):
