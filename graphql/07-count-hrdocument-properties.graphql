#   print(f"System: {sum(1 for p in props if p['isSystemOwned'])}")
#   print(f"Custom: {sum(1 for p in props if not p['isSystemOwned'])}")
#   print(f"Hidden: {sum(1 for p in props if p['isHidden'])}")
#   EOF
#
# Expected baseline (live GraphQL, 2025):
#   Total: 108  |  System: 63  |  Custom: 45  |  Hidden: 42  |  Visible: 66

query CountHRDocumentProperties {
  admClassDefinition(
    repositoryIdentifier: "OS1"
    identifier: "HRDocument"
  ) {
    symbolicName
    displayName
    propertyDefinitions {
      symbolicName
      displayName
      dataType
      cardinality
      isSystemOwned
      isHidden
    }
  }
}
